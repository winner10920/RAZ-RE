adapter driver remote_bitbang
remote_bitbang host n32-swd-bridge.local
remote_bitbang port 3335

transport select swd

set _CHIPNAME n32g031
swd newdap $_CHIPNAME cpu -expected-id 0x0bc11477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

reset_config srst_only srst_nogate

# Helper proc to unlock, erase, and write N32G031 Flash via FMC registers
proc n32_unlock_flash {} {
    # Write KEY1 and KEY2 to FLASH_KEYR (0x40022004)
    mww 0x40022004 0x45670123
    mww 0x40022004 0xCDEF89AB
}

init
